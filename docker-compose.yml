version: '3.9'

services:
  # ---- PostgreSQL ----
  postgres:
    image: postgres:16-alpine
    container_name: cleancare-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER:     cleancare
      POSTGRES_PASSWORD: password
      POSTGRES_DB:       cleancare_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL','pg_isready -U cleancare']
      interval: 10s
      timeout: 5s
      retries: 5

  # ---- Redis ----
  redis:
    image: redis:7-alpine
    container_name: cleancare-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ['CMD','redis-cli','ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # ---- Backend ----
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cleancare-backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://cleancare:password@postgres:5432/cleancare_db?schema=public
      REDIS_URL:    redis://redis:6379
    ports:
      - '4000:4000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ---- Customer App ----
  customer:
    build:
      context: ./apps/customer
      dockerfile: Dockerfile
    container_name: cleancare-customer
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000/api
    ports:
      - '3000:3000'
    depends_on:
      - backend

  # ---- Driver App ----
  driver:
    build:
      context: ./apps/driver
      dockerfile: Dockerfile
    container_name: cleancare-driver
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000/api
    ports:
      - '3001:3001'
    depends_on:
      - backend

  # ---- Admin App ----
  admin:
    build:
      context: ./apps/admin
      dockerfile: Dockerfile
    container_name: cleancare-admin
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000/api
    ports:
      - '3002:3002'
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
